<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Magie — Timeline dos Jogadores</title>
<style>
:root{--bg:#e8d9b8;--panel:#f3e8cc;--ink:#3a2918;--mut:#7d6648;--line:#b39c72;--acc:#8a2d1c;--font:Georgia,"Palatino Linotype",serif;--fs:16px;--rad:4px;--grain:.35;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c14;--panel:#33281c;--ink:#eadcbf;--mut:#a8957a;--line:#5a4a35;--acc:#d98a6a}}
:root[data-theme="dark"]{--bg:#241c14;--panel:#33281c;--ink:#eadcbf;--mut:#a8957a;--line:#5a4a35;--acc:#d98a6a}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:radial-gradient(ellipse at center,transparent 50%,rgba(70,40,10,.3)),var(--bg);color:var(--ink);font:var(--fs)/1.45 var(--font)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;mix-blend-mode:multiply;opacity:var(--grain);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .28 0 0 0 0 .12 0 0 0 .7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
[hidden]{display:none!important}
input,textarea,button,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px double var(--line)}
h1{font-size:1.3em;font-style:italic;margin:0 8px 0 0}
.f{padding:6px 9px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);width:100%;box-sizing:border-box}
.f:focus,.b:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.b{padding:5px 11px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);cursor:pointer}
.b:hover,.b.on{border-color:var(--acc)}
.b.on{background:var(--acc);color:var(--panel)}
.pri{background:var(--acc);border-color:var(--acc);color:var(--panel);font-weight:700}
#q{flex:1;min-width:120px;max-width:260px;width:auto}
#add{width:34px;height:34px;border-radius:50%;padding:0;font-size:22px;line-height:1}
#zm{display:flex;gap:6px}
#st{color:var(--mut);font-size:.8em}
#sc{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;cursor:grab;touch-action:none;overscroll-behavior:contain}
#sc.drag{cursor:grabbing;user-select:none}
#tr{position:relative;height:100%;min-height:340px}
#ly{position:absolute;inset:0;will-change:transform}
.axis{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:var(--line);border-radius:2px}
.tk{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);opacity:.6}
.tk span{position:absolute;bottom:8px;left:6px;font-size:.75em;color:var(--mut);white-space:nowrap}
.hoje{border-left:2px solid var(--acc);opacity:.7}.hoje span{color:var(--acc);top:8px;bottom:auto;font-style:italic}
.ev{position:absolute;top:50%;width:0;height:0;cursor:pointer}
.dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:var(--acc);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--acc);z-index:2;transition:transform .12s}
.ev:hover .dot{transform:scale(1.35)}
.stem{position:absolute;left:0;width:1px;background:var(--line)}
.lbl{position:absolute;left:-6px;box-sizing:border-box;max-width:170px;height:22px;padding:0 9px;font-size:.8em;line-height:20px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.hit .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 35%,transparent)}
.ev.hit .lbl{border-color:var(--acc)}.ev.dim{opacity:.2}
.gh{display:none;position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;box-sizing:border-box;border:1.5px dashed var(--acc);border-radius:50%;color:var(--acc);align-items:center;justify-content:center;pointer-events:none;z-index:3}
.hint{position:absolute;left:0;right:0;top:calc(50% - 60px);text-align:center;color:var(--mut);font-style:italic;pointer-events:none}
#tip{position:fixed;display:none;z-index:60;max-width:270px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);box-shadow:0 8px 24px rgba(50,30,10,.3);pointer-events:none;font-size:.85em}
#tip small{display:block;color:var(--mut)}
#tip p{margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.pg{flex:1;min-height:0;overflow:auto;padding:16px 14px;max-width:760px;width:100%;box-sizing:border-box;margin:0 auto}
.yr{margin:18px 0 6px;font-style:italic;color:var(--acc);border-bottom:1px solid var(--line)}
.it{display:flex;gap:10px;align-items:baseline;padding:8px 6px;border-bottom:1px dotted var(--line);cursor:pointer}
.it:hover{background:color-mix(in srgb,var(--panel) 70%,transparent)}
.it>div{flex:1;min-width:0}.it small{color:var(--mut);display:block}
.it p{margin:2px 0 0;color:var(--mut);font-size:.9em;white-space:pre-line;overflow:hidden;max-height:3em}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
.sg label,dialog label{display:block;font-size:.85em;color:var(--mut)}
.sg .f,dialog .f{margin-top:4px;color:var(--ink)}
input[type=color]{padding:2px;height:34px}
h2{font-size:1.05em;margin:20px 0 8px;font-style:italic}
dialog{width:min(430px,92vw);padding:18px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);color:var(--ink);box-shadow:0 12px 36px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(30,15,0,.45)}
dialog label{margin-bottom:12px}
textarea.f{min-height:90px;resize:vertical}
.r3{display:grid;grid-template-columns:70px 1fr 90px;gap:8px}
.row{display:flex;gap:8px;justify-content:flex-end}
#del{margin-right:auto}
</style>

<style>
/* Refinamento visual */
:root{
  --panel2:color-mix(in srgb,var(--panel) 84%,#d6bd8e);
  --shadow:rgba(54,34,15,.22);
}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 85%,rgba(76,45,17,.10),transparent 30%),
    linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--bg) 78%,#7f5b34));
}
header{
  position:relative;z-index:10;padding:12px 14px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 78%,transparent);
  background:color-mix(in srgb,var(--panel) 91%,transparent);
  box-shadow:0 8px 22px rgba(55,35,15,.08);
  backdrop-filter:blur(8px)
}
h1{letter-spacing:.015em;padding-right:14px;position:relative}
h1::after{content:"";position:absolute;right:0;top:15%;bottom:15%;width:1px;background:var(--line);opacity:.6}
.f{
  padding:8px 10px;border-radius:calc(var(--rad) + 4px);
  background:color-mix(in srgb,var(--panel) 92%,white 8%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  transition:.15s
}
.f:hover{border-color:color-mix(in srgb,var(--acc) 32%,var(--line))}
.f:focus,.b:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.b{
  min-height:34px;padding:6px 11px;border-radius:calc(var(--rad) + 4px);
  background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0)),var(--panel);
  box-shadow:0 2px 7px rgba(45,28,10,.08);transition:.12s
}
.b:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(45,28,10,.11)}
.b.on{background:color-mix(in srgb,var(--acc) 10%,var(--panel));color:var(--acc);font-weight:700}
.pri{background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 72%,#31150e));color:#fff7e9}
#add{width:36px;height:36px}
#zm{
  padding:3px;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  border-radius:calc(var(--rad) + 6px);background:color-mix(in srgb,var(--panel2) 38%,transparent)
}
#zm .b{box-shadow:none;min-width:36px}
#st{margin-left:auto;white-space:nowrap}
#sc{
  position:relative;
  background:linear-gradient(to bottom,transparent 0,transparent calc(50% - 95px),
  color-mix(in srgb,var(--panel) 35%,transparent) calc(50% - 95px),
  color-mix(in srgb,var(--panel) 35%,transparent) calc(50% + 95px),transparent calc(50% + 95px))
}
#sc::-webkit-scrollbar{height:12px}
#sc::-webkit-scrollbar-track{background:color-mix(in srgb,var(--panel2) 30%,transparent)}
#sc::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--line) 78%,transparent);border:3px solid transparent;background-clip:padding-box;border-radius:99px}
#tr{min-height:390px}
.axis{
  height:4px;margin-top:-2px;border-radius:99px;
  background:linear-gradient(to right,color-mix(in srgb,var(--line) 55%,transparent),var(--line) 12%,var(--line) 88%,color-mix(in srgb,var(--line) 55%,transparent))
}
.tk{border-left-color:color-mix(in srgb,var(--line) 58%,transparent);opacity:.76}
.tk span{
  bottom:12px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--panel) 74%,transparent);
  backdrop-filter:blur(2px)
}
.hoje{opacity:.9}
.hoje span{color:#fff7e9;background:var(--acc);top:12px;bottom:auto;padding:3px 7px;box-shadow:0 3px 8px color-mix(in srgb,var(--acc) 22%,transparent)}
.dot{
  border:3px solid var(--panel);
  box-shadow:0 0 0 1px var(--acc),0 4px 10px color-mix(in srgb,var(--acc) 20%,transparent)
}
.ev:hover .dot{transform:scale(1.4);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
.lbl{
  height:27px;max-width:188px;padding:2px 10px 1px;line-height:21px;border-radius:8px;
  background:color-mix(in srgb,var(--panel) 96%,transparent);box-shadow:0 4px 12px rgba(50,30,10,.11)
}
.ev:hover .lbl{border-color:color-mix(in srgb,var(--acc) 58%,var(--line))}
.ev.dim{opacity:.17;filter:saturate(.5)}
#tip{
  max-width:310px;padding:11px 13px;border-radius:11px;background:color-mix(in srgb,var(--panel) 97%,transparent);
  box-shadow:0 14px 35px rgba(50,30,10,.28);backdrop-filter:blur(7px)
}
#tip b{display:block;font-size:1.02em;margin-bottom:3px}
#tip p{margin-top:8px;padding-top:7px;border-top:1px dotted var(--line);-webkit-line-clamp:5}
.pg{max-width:900px;padding:24px 18px 42px}
.yr{margin-top:24px;padding-bottom:6px;font-size:1.05em;font-weight:700}
.it{
  align-items:center;margin:7px 0;padding:11px 12px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  border-radius:10px;background:color-mix(in srgb,var(--panel) 62%,transparent);transition:.12s
}
.it:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--acc) 40%,var(--line));box-shadow:0 5px 14px rgba(50,30,10,.08)}
h2{padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
dialog{
  width:min(470px,92vw);padding:0;border-radius:14px;overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.38)
}
dialog::before{
  content:"Evento da linha do tempo";display:block;padding:14px 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel2) 45%,transparent);font-weight:700;font-style:italic
}
dialog::backdrop{background:rgba(30,15,0,.5);backdrop-filter:blur(3px)}
dialog>label:first-of-type{margin-top:16px}
dialog label{margin:0 18px 13px}
textarea.f{min-height:105px}
.row{padding:14px 18px 18px;margin-top:4px;border-top:1px solid color-mix(in srgb,var(--line) 58%,transparent)}
#del{color:var(--acc)}

.storage-card{
  display:grid;
  gap:10px;
  margin:0 0 18px;
  padding:13px 14px;
  border:1px solid color-mix(in srgb,var(--line) 58%,transparent);
  border-radius:11px;
  background:color-mix(in srgb,var(--panel) 68%,transparent);
  box-shadow:0 4px 12px rgba(50,30,10,.06)
}
.storage-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.storage-card-head strong{
  font-size:.92em
}
.storage-card-head button{
  min-height:28px;
  padding:4px 9px;
  font-size:.78em
}
.storage-line{
  display:flex;
  justify-content:space-between;
  gap:14px;
  color:var(--mut);
  font-size:.82em
}
.storage-line b{
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  text-align:right
}
.storage-bar{
  height:7px;
  overflow:hidden;
  border-radius:99px;
  background:color-mix(in srgb,var(--line) 25%,transparent)
}
.storage-bar > i{
  display:block;
  height:100%;
  width:0%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--acc2),var(--acc));
  transition:width .25s ease
}
.storage-note{
  margin:0;
  color:var(--mut);
  font-size:.75em;
  line-height:1.4
}


.timeline-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  padding:8px 14px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  background:color-mix(in srgb,var(--panel2) 35%,transparent);
  position:relative;
  z-index:9
}
.timeline-tabs{display:flex;gap:6px;flex-wrap:wrap}
.timeline-tab{font-size:.82em}
.timeline-tab.active{
  border-color:var(--acc);
  background:color-mix(in srgb,var(--acc) 12%,var(--panel));
  color:var(--acc);
  font-weight:700
}
.account-area{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.account-label{font-size:.78em;color:var(--mut)}
.sync-state{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.75em;
  color:var(--mut)
}
.sync-state::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:var(--line);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--line) 20%,transparent)
}
.sync-state.ok::before{background:#66855c}
.sync-state.busy::before{background:#b58b45}
.sync-state.err::before{background:#a34b40}
.login-dialog{width:min(390px,92vw)}
.login-dialog h2{margin:0 0 14px}
.login-help{margin:-4px 0 14px;color:var(--mut);font-size:.82em;line-height:1.45}
.login-error{min-height:18px;color:#9b3d34;font-size:.8em;margin:4px 0}
.library-tools{
  display:flex;gap:8px;flex-wrap:wrap;
  margin:0 0 16px;padding:12px;
  border:1px solid color-mix(in srgb,var(--line) 58%,transparent);
  border-radius:11px;
  background:color-mix(in srgb,var(--panel) 68%,transparent)
}
.library-tools-copy{flex:1;min-width:210px}
.library-tools-copy strong{display:block;font-size:.92em}
.library-tools-copy small{display:block;color:var(--mut);margin-top:3px}
.readonly-pill{
  display:inline-flex;align-items:center;
  padding:3px 7px;border:1px solid var(--line);
  border-radius:99px;color:var(--mut);font-size:.72em
}

.filter-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-count{
  display:inline-grid;place-items:center;
  min-width:20px;height:20px;padding:0 6px;
  border-radius:99px;
  background:color-mix(in srgb,var(--acc) 14%,transparent);
  color:var(--acc);
  font-size:.72em;font-weight:700
}
.tag-row{
  display:grid;
  grid-template-columns:minmax(120px,1fr) auto auto;
  gap:8px;align-items:center;
  padding:8px 0;
  border-bottom:1px solid color-mix(in srgb,var(--line) 35%,transparent)
}
.tag-row:last-child{border-bottom:0}
.tag-name{font-weight:700;overflow-wrap:anywhere}
.tag-action.active{
  border-color:var(--acc);
  background:color-mix(in srgb,var(--acc) 12%,var(--panel));
  color:var(--acc)
}
.tag-list{
  max-height:min(48vh,430px);
  overflow:auto;
  margin-top:8px
}
.tag-empty{color:var(--mut);font-style:italic}
.tag-chip{
  display:inline-flex;align-items:center;
  padding:2px 7px;margin:4px 4px 0 0;
  border-radius:99px;
  border:1px solid color-mix(in srgb,var(--line) 68%,transparent);
  background:color-mix(in srgb,var(--panel2) 48%,transparent);
  color:var(--mut);font-size:.72em
}
.public-confirm{
  display:none;
  margin-top:10px;
  padding:10px;
  border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));
  border-radius:10px;
  background:color-mix(in srgb,var(--acc) 7%,var(--panel));
  gap:8px
}
.public-confirm.show{display:grid}
.public-confirm p{margin:0;color:var(--mut);font-size:.82em;line-height:1.4}
.public-confirm .row{margin-top:0}


/* espaçamento dos diálogos auxiliares */
.login-dialog::before,
.filter-dialog::before{
  display:none
}

.login-dialog,
.filter-dialog{
  padding:18px
}

.login-dialog h2,
.filter-dialog h2{
  margin:0 0 12px;
  padding:0 0 8px
}

.login-dialog .login-help{
  margin:0 0 16px
}

.login-dialog label{
  margin:0 0 13px
}

.login-dialog .login-error{
  margin:2px 0 8px
}

.login-dialog .row,
.filter-dialog .row{
  margin:12px -18px -18px;
  padding:14px 18px 18px
}

/* deixa as tags respirarem um pouco mais, inclusive nas tooltips */
.tag-chip{
  padding:4px 9px;
  margin:5px 5px 0 0;
  line-height:1.25
}

#tip > div:last-child{
  padding-top:3px
}

@media(max-width:760px){
  .timeline-bar{padding:8px 10px}
  .account-area{width:100%;justify-content:space-between}
}

@media(pointer:coarse){
  .b{min-height:42px}
  #add{width:42px;height:42px}
  .ev::after{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px}
  .dot{width:16px;height:16px;left:-8px;top:-8px}
}

@media(max-width:760px){
  header{padding:10px}
  h1{width:100%;padding:0 0 8px;margin:0;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
  h1::after{display:none}
  #q{order:3;max-width:none;flex-basis:100%}
  #st{display:none}
  .pg{padding:18px 12px 36px}
}
</style>

</head>
<body>
<header>
  <h1>Linha do Tempo</h1>
  <button class="b on" data-t="sc">Linha do tempo</button>
  <button class="b" data-t="lib">Biblioteca</button>
  <button class="b" data-t="set" id="appearanceTab">Aparência</button>
  <input id="q" class="f" type="search" placeholder="Buscar evento…" aria-label="Buscar evento">
  <span id="zm"><button class="b" id="zo" title="Diminuir zoom" aria-label="Diminuir zoom">−</button><button class="b" id="fit" title="Mostrar todos os eventos">Ajustar</button><button class="b" id="zi" title="Aumentar zoom" aria-label="Aumentar zoom">+</button></span>
  <button class="b pri" id="add" title="Novo evento" aria-label="Novo evento">+</button>
  <span id="st"></span>
</header>
<div class="timeline-bar">
  <div class="filter-wrap">
    <div id="timelineTabs" class="timeline-tabs"></div>
    <button class="b" id="filterBtn" type="button">Filtros <span id="filterCount" class="filter-count" hidden>0</span></button>
  </div>
  <div class="account-area">
    <span id="syncState" class="sync-state">Carregando…</span>
    <span id="accountLabel" class="account-label">Timeline pública</span>
  </div>
</div>
<div id="sc"><div id="tr"><div id="ly"></div><div class="axis"></div><div class="gh" id="gh">+</div></div></div>
<div id="lib" class="pg" hidden></div>
<div id="set" class="pg" hidden></div>
<div id="tip"></div>
<dialog id="dlg">
  <label>Nome<input id="nm" class="f" maxlength="120"></label>
  <label>Data (dia · mês · ano DE)<div class="r3"><input id="dd" class="f" type="number" min="1" max="30"><select id="dm" class="f"></select><input id="dy" class="f" type="number"></div></label>
  <label>Descrição<textarea id="ds" class="f"></textarea></label>
  <label>Tags<input id="tg" class="f" maxlength="300"></label>

  <div class="row">
    <button class="b" id="del" type="button">Excluir</button>
    <button class="b" id="cx" type="button">Cancelar</button>
    <button class="b pri" id="sv" type="button">Salvar evento</button>
  </div>
</dialog>
<dialog id="filterDlg" class="filter-dialog">
  <h2 style="margin-top:0">Filtrar por tags</h2>
  <p style="color:var(--mut);font-size:.84em;line-height:1.45;margin-top:-4px">
    “Mostrar” mantém eventos com pelo menos uma das tags selecionadas.

const idx=(y,m,d)=>y*360+m*30+d-1,
 parts=i=>{const y=Math.floor(i/360),r=i-y*360;return{y,m:Math.floor(r/30),d:r%30+1}};

function normalizedCfg(raw){
  const c=raw&&typeof raw==="object"?raw:{};

function cleanTags(value){
  const src=Array.isArray(value)?value:String(value||"").split(",");
  const seen=new Set();
  const out=[];
  for(const raw of src){
    const tag=String(raw||"").trim().replace(/\s+/g," ");
    if(!tag)continue;
    const key=tag.toLocaleLowerCase("pt-BR");
    if(seen.has(key))continue;
    seen.add(key);
    out.push(tag.slice(0,60));
  }
  return out.slice(0,30);
}

function eventFromRow(row){
  return{
    id:row.id,
    name:row.nome||row.name||"Evento",
    desc:row.descricao||row.desc||"",

    tags:cleanTags(row.tags||[])
  };
}

function idbRequest(req){
  return new Promise((resolve,reject)=>{
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("Falha no IndexedDB."));
  });
}

function idbTxDone(tx){
  return new Promise((resolve,reject)=>{
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error("Falha na transação do IndexedDB."));
    tx.onabort=()=>reject(tx.error||new Error("Transação do IndexedDB cancelada."));
  });
}

async function openLocalDb(){
  if(db)return db;
  db=await new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains(STORE_EVENTS)){
        const store=d.createObjectStore(STORE_EVENTS,{keyPath:"id"});
        store.createIndex("tempo","t",{unique:false});
      }
      if(!d.objectStoreNames.contains(STORE_CONFIG)){
        d.createObjectStore(STORE_CONFIG,{keyPath:"key"});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("Não foi possível abrir o armazenamento local."));
  });
  return db;
}

async function loadLocalConfig(){
  const d=await openLocalDb();
  const tx=d.transaction(STORE_CONFIG,"readonly");
  const row=await idbRequest(tx.objectStore(STORE_CONFIG).get(LOCAL_CFG_KEY));
  await idbTxDone(tx);
  return row?.value||null;
}

async function saveLocalConfig(value){
  const d=await openLocalDb();
  const tx=d.transaction(STORE_CONFIG,"readwrite");
  tx.objectStore(STORE_CONFIG).put({
    key:LOCAL_CFG_KEY,
    value,
    atualizadoEm:new Date().toISOString()
  });
  await idbTxDone(tx);
}

async function loadLocalEvents(){
  const d=await openLocalDb();
  const tx=d.transaction(STORE_EVENTS,"readonly");
  const rows=await idbRequest(tx.objectStore(STORE_EVENTS).getAll());
  await idbTxDone(tx);
  return (rows||[]).map(eventFromRow).filter(e=>Number.isFinite(e.t)).sort((a,b)=>a.t-b.t);
}

async function putLocalEvent(v){
  const d=await openLocalDb();
  const tx=d.transaction(STORE_EVENTS,"readwrite");
  tx.objectStore(STORE_EVENTS).put({
    id:v.id,
    name:v.name,
    desc:v.desc||"",
    t:Number(v.t),
    tags:cleanTags(v.tags||[]),
    atualizadoEm:new Date().toISOString()
  });
  await idbTxDone(tx);
}

async function deleteLocalEvent(id){
  const d=await openLocalDb();
  const tx=d.transaction(STORE_EVENTS,"readwrite");
  tx.objectStore(STORE_EVENTS).delete(id);
  await idbTxDone(tx);
}

async function replaceLocalEvents(items){
  const d=await openLocalDb();
  const tx=d.transaction(STORE_EVENTS,"readwrite");
  const store=tx.objectStore(STORE_EVENTS);
  store.clear();
  for(const e of items){
    store.put({
      id:e.id,
      name:e.name,
      desc:e.desc||"",
      t:Number(e.t),
      tags:cleanTags(e.tags||[]),
      atualizadoEm:new Date().toISOString()
    });
  }
  await idbTxDone(tx);
}

function getBackupSettings(){
  try{
    const raw=JSON.parse(localStorage.getItem(BACKUP_SETTINGS_KEY)||"{}");
    return{
      enabled:!!raw.enabled,
      interval:Math.min(100,Math.max(1,Number(raw.interval)||5)),
      changes:Math.max(0,Number(raw.changes)||0)
    };
  }catch{
    return{enabled:false,interval:5,changes:0};
  }
}

function saveBackupSettings(v){
  try{localStorage.setItem(BACKUP_SETTINGS_KEY,JSON.stringify(v));}catch{}
}

function localBackupPayload(){

async function registerLocalChange(){
  if(currentTimeline?.slug!=="local")return;
  const settings=getBackupSettings();
  if(!settings.enabled)return;
  settings.changes++;
  if(settings.changes>=settings.interval){
    settings.changes=0;
    saveBackupSettings(settings);
    downloadJson(
      `la-magie-timeline-pessoal-auto-${new Date().toISOString().slice(0,10)}.json`,
      localBackupPayload()

    saveBackupSettings(settings);
  }
}

/* intervalo e marcações */

function eventTagKeys(e){
  return new Set((e.tags||[]).map(t=>String(t).toLocaleLowerCase("pt-BR")));
}

function filteredEvents(){
  return ev.filter(e=>{
    const keys=eventTagKeys(e);

    if(includeTags.size){
      let ok=false;
      for(const tag of includeTags){
        if(keys.has(tag)){ok=true;break}
      }
      if(!ok)return false;
    }

    for(const tag of excludeTags){
      if(keys.has(tag))return false;
    }

    return true;
  });
}

function allTags(){
  const map=new Map();
  for(const e of ev){
    for(const tag of e.tags||[]){
      const key=String(tag).toLocaleLowerCase("pt-BR");
      if(!map.has(key))map.set(key,tag);
    }
  }
  return [...map.entries()].sort((a,b)=>a[1].localeCompare(b[1],"pt-BR",{sensitivity:"base"}));
}

function updateFilterBadge(){
  const n=includeTags.size+excludeTags.size;
  const badge=$('#filterCount');
  if(!badge)return;
  badge.hidden=!n;
  badge.textContent=String(n);
  $('#filterBtn')?.classList.toggle('on',!!n);
}

function renderFilterDialog(){
  const box=$('#filterTagList');
  const tags=allTags();
  box.innerHTML='';

  if(!tags.length){
    box.innerHTML='<p class="tag-empty">Nenhuma tag existe nesta timeline ainda.</p>';
    return;
  }

  for(const [key,label] of tags){
    const row=document.createElement('div');
    row.className='tag-row';
    row.innerHTML=`
      <div class="tag-name"></div>
      <button class="b tag-action" data-kind="include" type="button">Mostrar</button>
      <button class="b tag-action" data-kind="exclude" type="button">Ocultar</button>
    `;
    row.querySelector('.tag-name').textContent=label;

    const inc=row.querySelector('[data-kind="include"]');
    const exc=row.querySelector('[data-kind="exclude"]');

    const paint=()=>{
      inc.classList.toggle('active',includeTags.has(key));
      exc.classList.toggle('active',excludeTags.has(key));
    };

    inc.onclick=()=>{
      if(includeTags.has(key))includeTags.delete(key);
      else{
        includeTags.add(key);
        excludeTags.delete(key);
      }
      paint();
      updateFilterBadge();
      viewCenter=null;
      render();
    };

    exc.onclick=()=>{
      if(excludeTags.has(key))excludeTags.delete(key);
      else{
        excludeTags.add(key);
        includeTags.delete(key);
      }
      paint();
      updateFilterBadge();
      viewCenter=null;
      render();
    };

    paint();
    box.append(row);
  }
}

function range(){
  // Enquadramento padrão: anos inteiros dos eventos atualmente visíveis.
  const visible=filteredEvents();
  if(!visible.length){
    const p=parts(hoje());
    return[idx(p.y,0,1),idx(p.y+1,0,1)];
  }

  const primeiro=parts(Math.min(...visible.map(e=>e.t)));
  const ultimo=parts(Math.max(...visible.map(e=>e.t)));

  return[
    idx(primeiro.y,0,1),
    idx(ultimo.y+1,0,1)
  ];
}
function ticks(){
  const st=[['d',1],['d',5],['m',1],['m',3],['y',1],['y',2],['y',5],['y',10],['y',25],['y',50],['y',100],['y',250],['y',500],['y',1000]],L={d:1,m:30,y:360};
  const [u,n]=st.find(([u,n])=>n*L[u]*ppm>=90)||st[st.length-1],step=n*L[u],out=[];
  for(let t=Math.floor(t0/step)*step;t<=t1;t+=step){if(t<t0)continue;const p=parts(t);
    out.push([t,u=='y'?p.y+' DE':u=='m'?MES[p.m][0]+' '+p.y:p.d+' '+MES[p.m][0].slice(0,3)])}
  return out;
}

/* linha do tempo */
const X=t=>20+(t-t0)*ppm,match=(e,q)=>(e.name+' '+e.desc+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q);
function render(){
  if(tab=='sc')drawTimeline();else if(tab=='lib')drawLib();
}
function drawTimeline(){
  const [r0,r1]=range();
  const baseSpan=Math.max(1,r1-r0);
  const usable=Math.max(sc.clientWidth-40,300);

  // "Ajustar" define somente o enquadramento inicial/padrão.
  // A navegação em si é livre: viewCenter pode andar indefinidamente
  // para antes ou depois dos eventos existentes.
  if(viewCenter===null) viewCenter=(r0+r1)/2;

  const visibleSpan=baseSpan/zoom;
  t0=viewCenter-visibleSpan/2;
  t1=viewCenter+visibleSpan/2;
  ppm=usable/visibleSpan;

  tr.style.width=Math.max(sc.clientWidth,340)+'px';
  sc.scrollLeft=0;

  ly.textContent='';
  const a=parts(Math.floor(r0)),b=parts(Math.max(r0,Math.ceil(r1)-1));
  const vc=parts(Math.round(viewCenter));
  $('#st').textContent=`Padrão: ${a.y}–${b.y} DE · centro: ${vc.y} DE · zoom ${Math.round(zoom*100)}%`;
  ticks().forEach(([t,l])=>{const k=document.createElement('div');k.className='tk';k.style.left=X(t)+'px';k.innerHTML='<span></span>';k.firstChild.textContent=l;ly.append(k)});
  const h=hoje();if(h>=t0&&h<=t1){const k=document.createElement('div');k.className='tk hoje';k.style.left=X(h)+'px';k.innerHTML='<span>hoje</span>';ly.append(k)}
  const visibleEvents=filteredEvents();
  if(!visibleEvents.length){
    const e=document.createElement('div');
    e.className='hint';
    e.textContent=(includeTags.size||excludeTags.size)
      ?'Nenhum evento corresponde aos filtros atuais.'
      :(canEdit?'Clique na linha ou em + para adicionar o primeiro evento.':'Nenhum evento publicado nesta timeline.');
    ly.append(e)
  }
  const q=$('#q').value.trim().toLowerCase(),up=[-1e9,-1e9,-1e9],dn=[-1e9,-1e9,-1e9];
  [...visibleEvents].sort((a,b)=>a.t-b.t).forEach(e=>{
    const x=X(e.t),w=Math.min(e.name.length*7.4+18,172);let side=null,lane=0;
    find:for(let l=0;l<3;l++)for(const [s,arr] of [['u',up],['d',dn]])if(arr[l]<=x-4){side=s;lane=l;arr[l]=x+w+8;break find}
    const el=document.createElement('div');el.className='ev';el.style.left=x+'px';
    if(q)el.classList.add(match(e,q)?'hit':'dim');
    let s='<i class="dot"></i>';
    if(side){const y0=side=='u'?-(34+lane*28):12+lane*28;s+=`<i class="stem" style="top:${side=='u'?y0+22:6}px;height:${6+lane*28}px"></i><b class="lbl" style="top:${y0}px"></b>`}
    el.innerHTML=s;const lb=el.querySelector('.lbl');if(lb)lb.textContent=e.name;
    el.onclick=c=>{c.stopPropagation();if(dragged)return;if(canEdit)openDlg(e);else showTip(e,el.firstChild)};
    el.onmouseenter=()=>showTip(e,el.firstChild);el.onmouseleave=()=>tip.style.display='none';
    ly.append(el);
  });
}
function showTip(e,dot){
  const p=parts(e.t);tip.innerHTML='<b></b><small></small><small></small><p></p>';
  tip.children[0].textContent=e.name;
  tip.children[1].textContent=`${SEM[wk(e.t)][0]} (${SEM[wk(e.t)][1]}) · ${fd(e.t)}`;
  tip.children[2].textContent=MES[p.m][1];
  if(e.desc)tip.children[3].textContent=e.desc;else tip.children[3].remove();
  if(e.tags?.length){
    const tags=document.createElement('div');
    tags.style.marginTop='7px';
    e.tags.forEach(t=>{
      const chip=document.createElement('span');
      chip.className='tag-chip';
      chip.textContent=t;
      tags.append(chip);
    });
    tip.append(tags);
  }
  tip.style.display='block';
  const r=dot.getBoundingClientRect(),th=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(r.left-8,innerWidth-tip.offsetWidth-8))+'px';
  tip.style.top=(r.bottom+th+14<innerHeight?r.bottom+10:r.top-th-10)+'px';
}

/* zoom (roda do mouse) e arrastar */
function setZoom(z,cx){
  cx=cx??sc.clientWidth/2;

  // preserva sob o cursor a mesma data enquanto o zoom muda
  const anchor=t0+(cx-20)/ppm;
  zoom=Math.min(Math.max(z,.02),8000);

  const [r0,r1]=range();
  const baseSpan=Math.max(1,r1-r0);
  const usable=Math.max(sc.clientWidth-40,300);
  const visibleSpan=baseSpan/zoom;
  const newPpm=usable/visibleSpan;

  const newT0=anchor-(cx-20)/newPpm;
  viewCenter=newT0+visibleSpan/2;

  drawTimeline();
}

function fitTimeline(){
  const [r0,r1]=range();
  zoom=1;
  viewCenter=(r0+r1)/2;
  drawTimeline();
}

function centerOn(t,z=null){
  if(z!==null) zoom=Math.min(Math.max(z,.02),8000);
  viewCenter=t;
  drawTimeline();
}

$('#zi').onclick=()=>setZoom(zoom*1.6);
$('#zo').onclick=()=>setZoom(zoom/1.6);
$('#fit').onclick=fitTimeline;

sc.addEventListener('wheel',e=>{
  e.preventDefault();
  tip.style.display='none';
  setZoom(
    zoom*Math.exp(-e.deltaY*.0018),
    e.clientX-sc.getBoundingClientRect().left
  );
},{passive:false});

let dg=null,dragged=false;
const activePointers=new Map();
let pinch=null;

function pointerLocalX(e){
  return e.clientX-sc.getBoundingClientRect().left;
}

function pointerDistance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function beginPinch(){
  if(activePointers.size<2)return;
  const [a,b]=[...activePointers.values()].slice(0,2);
  const rect=sc.getBoundingClientRect();
  const cx=(a.x+b.x)/2-rect.left;
  const distance=Math.max(1,pointerDistance(a,b));
  const anchor=t0+(cx-20)/ppm;

  pinch={distance,zoom,anchor};
  dg=null;
  ly.style.transform='';
  sc.classList.add('drag');
  tip.style.display='none';
}

function updatePinch(){
  if(!pinch||activePointers.size<2)return;
  const [a,b]=[...activePointers.values()].slice(0,2);
  const rect=sc.getBoundingClientRect();
  const cx=(a.x+b.x)/2-rect.left;
  const distance=Math.max(1,pointerDistance(a,b));
  const nextZoom=Math.min(Math.max(pinch.zoom*(distance/pinch.distance),.02),8000);

  const [r0,r1]=range();
  const baseSpan=Math.max(1,r1-r0);
  const usable=Math.max(sc.clientWidth-40,300);
  const visibleSpan=baseSpan/nextZoom;
  const nextPpm=usable/visibleSpan;
  const nextT0=pinch.anchor-(cx-20)/nextPpm;

  zoom=nextZoom;
  viewCenter=nextT0+visibleSpan/2;
  drawTimeline();
}

sc.addEventListener('pointerdown',e=>{
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});

  if(sc.setPointerCapture){
    try{sc.setPointerCapture(e.pointerId)}catch(_error){}
  }

  if(activePointers.size>=2){
    beginPinch();
    return;
  }

  if((e.pointerType==='mouse'&&e.button!==0)||e.target.closest('.ev'))return;

  dg={
    pointerId:e.pointerId,
    x:e.clientX,
    center:viewCenter??((t0+t1)/2),
    ppm,
    dx:0,
    m:false
  };
});

sc.addEventListener('pointermove',e=>{
  if(activePointers.has(e.pointerId)){
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  }

  if(activePointers.size>=2){
    if(!pinch)beginPinch();
    updatePinch();
    return;
  }

  if(!dg||dg.pointerId!==e.pointerId)return;

  const dx=e.clientX-dg.x;
  dg.dx=dx;

  if(Math.abs(dx)>4){
    dg.m=true;
    sc.classList.add('drag');
    tip.style.display='none';
  }

  if(dg.m){
    // Durante o arrasto não recriamos os eventos/ticks.
    // Movemos somente a camada já desenhada, o que elimina
    // os "pulos" causados por redesenhar o DOM a cada pixel.
    ly.style.transform=`translateX(${dx}px)`;
  }
});

function finishPointer(e){
  activePointers.delete(e.pointerId);

  if(pinch){
    if(activePointers.size<2){
      pinch=null;
      dragged=true;
      sc.classList.remove('drag');
      ly.style.transform='';
      drawTimeline();
      setTimeout(()=>dragged=false,80);
    }
    return;
  }

  if(!dg||dg.pointerId!==e.pointerId)return;

  dragged=dg.m;

  if(dg.m){
    // Depois que o usuário solta, convertemos a distância
    // arrastada em dias e fazemos apenas um redesenho final.
    viewCenter=dg.center-dg.dx/dg.ppm;
  }

  ly.style.transform='';
  dg=null;
  sc.classList.remove('drag');

  if(dragged)drawTimeline();
  setTimeout(()=>dragged=false,80);
}

sc.addEventListener('pointerup',finishPointer);
sc.addEventListener('pointercancel',finishPointer);
sc.addEventListener('lostpointercapture',e=>{
  if(activePointers.has(e.pointerId))finishPointer(e);
});

  ly.style.transform='';
  render();
});

/* biblioteca / backup */
function downloadJson(nome,dados){
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=nome;
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportTimeline(){
  if(!currentTimeline)return;
  const payload=currentTimeline.slug==="local"
    ?localBackupPayload()
    :{
      formato:"la-magie-timeline",
      versao:1,
      exportadoEm:new Date().toISOString(),
      timeline:{
        slug:currentTimeline.slug,
        nome:currentTimeline.nome,
        configuracao:{hoje:cfg.hoje,wd:cfg.wd,theme:cfg.theme}
      },
      eventos:[...ev].sort((a,b)=>a.t-b.t)
    };

  downloadJson(
    currentTimeline.slug==="local"
      ?"la-magie-timeline-pessoal.json"
      :`la-magie-timeline-${currentTimeline.slug}.json`,
    payload
  );
}

async function importTimelineFile(file){
  if(!canEdit||currentTimeline?.slug!=="local")return;

  const json=JSON.parse(await file.text());
  if(json?.formato!=="la-magie-timeline"||!Array.isArray(json.eventos)){
    throw new Error("Esse arquivo não é um backup válido da Timeline La Magie.");
  }

  const imported=json.eventos.map(e=>({
    id:typeof e.id==="string"?e.id:crypto.randomUUID(),
    name:String(e.name||e.nome||"Evento").slice(0,120),
    desc:String(e.desc||e.descricao||""),
    t:Number(e.t??e.tempo),
    tags:cleanTags(e.tags||[])
  })).filter(e=>Number.isFinite(e.t));

  const ok=confirm(
    `Substituir os ${ev.length} evento(s) salvos neste navegador pelos ${imported.length} evento(s) deste backup?`
  );
  if(!ok)return;

  setSync("Importando backup…","busy");
  await replaceLocalEvents(imported);

  if(json.timeline?.configuracao&&typeof json.timeline.configuracao==="object"){
    cfg=normalizedCfg(json.timeline.configuracao);
    const clean={hoje:cfg.hoje,wd:cfg.wd,theme:cfg.theme};
    await saveLocalConfig(clean);
    LOCAL_TIMELINE.configuracao=clean;
    currentTimeline.configuracao=clean;
    aplicarTema();
  }

  await switchTimeline("local");
  setSync("Backup importado","ok");
}

async function storageInfo(){
  const logical=new Blob([JSON.stringify({
    eventos:ev,
    configuracao:{hoje:cfg.hoje,wd:cfg.wd,theme:cfg.theme}
  })]).size;

  let usage=null,quota=null;
  try{
    const est=await navigator.storage?.estimate?.();
    usage=Number(est?.usage);
    quota=Number(est?.quota);
  }catch{}

  return{logical,usage,quota};
}

function formatBytes(n){
  if(!Number.isFinite(n))return"Indisponível";
  if(n<1024)return`${n} B`;
  const units=["KB","MB","GB"];
  let v=n/1024,i=0;
  while(v>=1024&&i<units.length-1){v/=1024;i++}
  return`${v.toLocaleString("pt-BR",{maximumFractionDigits:v<10?2:1})} ${units[i]}`;
}

async function updateStorageCard(){
  if(currentTimeline?.slug!=="local")return;
  const info=await storageInfo();
  const logical=$('#localLogicalSize');
  const usage=$('#localStorageUsage');
  const quota=$('#localStorageQuota');
  const bar=$('#localStorageBar');
  if(logical)logical.textContent=formatBytes(info.logical);
  if(usage)usage.textContent=formatBytes(info.usage);
  if(quota)quota.textContent=formatBytes(info.quota);
  if(bar&&Number.isFinite(info.usage)&&Number.isFinite(info.quota)&&info.quota>0){
    bar.style.width=`${Math.min(100,info.usage/info.quota*100)}%`;
  }
}

function bindLocalBackupControls(){
  if(currentTimeline?.slug!=="local")return;
  const settings=getBackupSettings();
  const enabled=$('#autoBackupEnabled');
  const interval=$('#autoBackupInterval');
  const status=$('#autoBackupStatus');

  if(enabled)enabled.checked=settings.enabled;
  if(interval)interval.value=String(settings.interval);

  const paint=()=>{
    const s=getBackupSettings();
    if(status){
      status.textContent=s.enabled
        ?`Backup automático: download a cada ${s.interval} alteração(ões). ${s.changes}/${s.interval} desde o último backup.`
        :"Backup automático desativado.";
    }
  };

  enabled?.addEventListener('change',()=>{
    const s=getBackupSettings();
    s.enabled=enabled.checked;
    saveBackupSettings(s);
    paint();
  });

  interval?.addEventListener('change',()=>{
    const s=getBackupSettings();
    s.interval=Math.min(100,Math.max(1,Number(interval.value)||5));
    interval.value=String(s.interval);
    saveBackupSettings(s);
    paint();
  });

  $('#refreshStorageBtn')?.addEventListener('click',updateStorageCard);
  paint();
  updateStorageCard();
}

/* aparência */
function clamp(n,min,max){return Math.min(max,Math.max(min,n))}

function hexRgb(hex){
  const h=String(hex||"").replace("#","").trim();
  const full=h.length===3?h.split("").map(c=>c+c).join(""):h.padEnd(6,"0").slice(0,6);
  const n=parseInt(full,16);
  if(!Number.isFinite(n))return{r:138,g:45,b:28};
  return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}

function rgbHex({r,g,b}){
  const c=n=>clamp(Math.round(n),0,255).toString(16).padStart(2,"0");
  return`#${c(r)}${c(g)}${c(b)}`;
}

function mix(a,b,t){
  return{
    r:a.r+(b.r-a.r)*t,
    g:a.g+(b.g-a.g)*t,
    b:a.b+(b.b-a.b)*t
  };
}

function lum(c){
  const f=v=>{
    v/=255;
    return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);
  };
  return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b);
}

function temaDerivado(baseHex,mode){
  const base=hexRgb(baseHex);
  const white={r:248,g:241,b:224};
  const cream={r:232,g:216,b:184};
  const black={r:28,g:21,b:15};
  const dark={r:47,g:35,b:24};

  let bg,panel,panel2,ink,mut,line,acc,acc2,shadow;

  if(mode==="claro"){
    bg=mix(base,white,.84);
    panel=mix(base,white,.93);
    panel2=mix(base,cream,.82);
    ink=mix(base,black,.78);
    mut=mix(base,dark,.62);
    line=mix(base,dark,.42);
    acc=mix(base,black,.08);
    acc2=mix(base,white,.28);
    shadow="rgba(54,34,15,.16)";
  }
  else if(mode==="escuro"){
    bg=mix(base,black,.72);
    panel=mix(base,black,.58);
    panel2=mix(base,dark,.48);
    ink=mix(base,white,.87);
    mut=mix(base,cream,.63);
    line=mix(base,cream,.34);
    acc=mix(base,white,.22);
    acc2=mix(base,white,.38);
    shadow="rgba(0,0,0,.42)";
  }
  else if(mode==="alto"){
    const light=lum(base)<.38;
    bg=light?mix(base,black,.82):mix(base,white,.82);
    panel=light?mix(base,black,.66):mix(base,white,.93);
    panel2=light?mix(base,dark,.50):mix(base,cream,.76);
    ink=light?white:black;
    mut=light?mix(white,base,.32):mix(black,base,.28);
    line=light?mix(white,base,.48):mix(black,base,.38);
    acc=light?mix(base,white,.16):mix(base,black,.12);
    acc2=light?mix(base,white,.40):mix(base,white,.22);
    shadow=light?"rgba(0,0,0,.48)":"rgba(45,25,10,.24)";
  }
  else if(mode==="baixo"){
    bg=mix(base,cream,.76);
    panel=mix(base,white,.84);
    panel2=mix(base,cream,.86);
    ink=mix(base,dark,.60);
    mut=mix(base,dark,.48);
    line=mix(base,dark,.28);
    acc=mix(base,dark,.14);
    acc2=mix(base,white,.30);
    shadow="rgba(54,34,15,.10)";
  }
  else{
    bg=mix(base,cream,.72);
    panel=mix(base,white,.88);
    panel2=mix(base,cream,.78);
    ink=mix(base,black,.73);
    mut=mix(base,dark,.56);
    line=mix(base,dark,.36);
    acc=base;
    acc2=mix(base,white,.28);
    shadow="rgba(54,34,15,.22)";
  }

  return{
    "--bg":rgbHex(bg),
    "--panel":rgbHex(panel),
    "--panel2":rgbHex(panel2),
    "--ink":rgbHex(ink),
    "--mut":rgbHex(mut),
    "--line":rgbHex(line),
    "--acc":rgbHex(acc),
    "--acc2":rgbHex(acc2),
    "--shadow":shadow
  };
}

function aplicarTema(){
  cfg.theme=cfg.theme||{};
  const color=cfg.theme.color||"#8a2d1c";
  const mode=cfg.theme.mode||"normal";
  const vars=temaDerivado(color,mode);

  Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  root.style.setProperty("--grain",String(cfg.theme.grain??.28));
  root.style.setProperty("--fs",`${cfg.theme.fontSize??16}px`);
}

    saveCfg();
  };

  ['hd','hm','hy','hw'].forEach(i=>$('#'+i).oninput=cal);

  $('#rs').onclick=()=>{
    cfg.theme={
      color:"#8a2d1c",
      mode:"normal",
      grain:.28,
      fontSize:16
    };

    // remove personalizações antigas salvas pelas versões anteriores
    cfg.vars={};
    [
      "--bg","--panel","--panel2","--ink","--mut","--line",
      "--acc","--acc2","--shadow","--font","--fs","--grain","--rad"
    ].forEach(k=>root.style.removeProperty(k));

    aplicarTema();
    saveCfg();
    drawSet();
  };
}



/* filtros */
$('#filterBtn').onclick=()=>{
  renderFilterDialog();
  $('#filterDlg').showModal();
};

$('#filterClose').onclick=()=>$('#filterDlg').close();

$('#filterClear').onclick=()=>{
  includeTags.clear();
  excludeTags.clear();
  updateFilterBadge();
  renderFilterDialog();
  viewCenter=null;
  render();
};

/* importação do backup local */
$('#timelineImportFile').addEventListener('change',async()=>{
  const file=$('#timelineImportFile').files?.[0];
  $('#timelineImportFile').value="";
  if(!file)return;
  try{
    await importTimelineFile(file);
    if(tab==="lib")drawLib();
  }catch(error){
    console.error(error);
    setSync("Falha ao importar","err");
    alert("Não foi possível importar o backup.\n\n"+error.message);
  }
});

/* abas e busca */
function show(t){
  if(t==='set'&&!canEdit)t='sc';
  tab=t;['sc','lib','set'].forEach(i=>$('#'+i).hidden=i!=t);
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  $('#zm').hidden=t!='sc';$('#q').hidden=t=='set';
  t=='set'?drawSet():render();
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('#q').addEventListener('input',render);
$('#q').addEventListener('keydown',e=>{
  if(e.key!='Enter'||tab!='sc')return;const q=e.target.value.trim().toLowerCase(),m=ev.filter(x=>match(x,q)).sort((a,b)=>a.t-b.t)[0];
  if(q&&m)centerOn(m.t);
});

/* início */
(async()=>{
  try{
    await refreshAccess("publica");
  }catch(error){
    console.error(error);
    setSync("Falha ao conectar","err");
    $('#st').textContent="Não foi possível carregar a timeline pública. A timeline local continua no navegador.";
  }
})();
</script>
